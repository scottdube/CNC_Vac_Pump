; VacController — PlatformIO project
; Board: D1 Mini32-class ESP32 (USB-C clone)
; All TFT_eSPI display config lives HERE as build flags — never edit the
; library's User_Setup.h.  lv_conf.h lives in include/.

[env:d1_mini32]
platform = espressif32
board = wemos_d1_mini32
framework = arduino
monitor_speed = 115200
upload_speed = 921600

lib_deps =
    lvgl/lvgl@8.3.11
    bodmer/TFT_eSPI@2.5.43

build_flags =
    ; ---- LVGL: use include/lv_conf.h ----
    -D LV_CONF_INCLUDE_SIMPLE
    -I include
    ; ---- TFT_eSPI: GC9A01 on repo pinout ----
    -D USER_SETUP_LOADED=1
    -D GC9A01_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=240
    -D TFT_MISO=19
    -D TFT_MOSI=23
    -D TFT_SCLK=18
    -D TFT_CS=5
    -D TFT_DC=17
    -D TFT_RST=16
    -D TFT_BL=21
    -D TFT_BACKLIGHT_ON=HIGH
    -D LOAD_GLCD=1
    -D SPI_FREQUENCY=40000000
    -D SPI_READ_FREQUENCY=20000000
